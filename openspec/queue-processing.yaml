---
feature: Queue Processing - ProcessAuditJob

description: |
  Job asynchronous untuk memproses audit dari webhook.
  Mengambil spec dan diff code, mengirim ke FastAPI AI engine,
  dan menyimpan hasil audit ke database.

queue_system:
  driver: redis
  job_name: ProcessAuditJob
  queue: default
  max_attempts: 3
  timeout: 300

responsibilities:
  - receive_project_id
  - fetch_project_spec
  - retrieve_commit_diff
  - call_fastapi_engine
  - parse_ai_response
  - store_audit_result
  - handle_failures

input_parameters:
  project_id: integer
  commit_hash: string
  diff: string (url or content)

ai_engine_integration:
  endpoint: http://localhost:8000/api/audit
  method: POST
  timeout: 60
  retry: 3
  body:
    spec: string (OpenSpec YAML)
    diff: string (git diff)

ai_response_contract:
  score: integer (0-100)
  status: enum (pending, partial, complete, failed)
  missing_requirements: array<string>
  recommended_prompt: string
  node_status: object
    auth: boolean
    validation: boolean
    logging: boolean

database_storage:
  table: audits
  fields:
    project_id: foreign_key
    commit_hash: string
    score: integer
    status: string
    result_json: json
    created_at: timestamp

error_handling:
  - connection_timeout: retry_3_times
  - invalid_response: mark_failed_log_error
  - database_error: mark_failed_log_error
  - project_not_found: mark_failed_log_error

logging:
  - log_job_started
  - log_ai_engine_call
  - log_ai_response_received
  - log_audit_stored
  - log_any_errors_with_context

validation:
  - project_must_exist
  - ai_response_must_be_valid_json
  - score_must_be_between_0_and_100
  - status_must_be_valid_enum

retry_strategy:
  max_attempts: 3
  backoff: exponential
  delay: 60 seconds

testing:
  - test_successful_audit_flow
  - test_ai_service_timeout
  - test_invalid_ai_response
  - test_database_storage
  - test_error_handling
  - test_job_retry_mechanism
