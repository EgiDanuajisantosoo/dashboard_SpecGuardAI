---
feature: SpecGuard AI - Complete System

version: 1.0
created_date: 2026-05-12

tagline: |
  AI-Powered Specification Compliance Auditor for Modern Git Workflow

description: |
  SpecGuard AI adalah sistem yang membantu tim pengembang memastikan bahwa
  implementasi kode benar-benar sesuai dengan spesifikasi bisnis secara otomatis
  melalui AI audit berbasis Git workflow.

core_components:
  - github_webhook_listener
  - queue_processing_system
  - ai_audit_engine
  - dashboard_ui
  - audit_api

system_flow:
  1_webhook_received: GitHub push event → /webhook/github
  2_validation: Verify GitHub HMAC-SHA256 signature
  3_extraction: Extract commit hash dan diff URL
  4_queue_dispatch: Dispatch ProcessAuditJob ke Redis queue
  5_async_processing: Queue worker mengambil job
  6_ai_call: Kirim spec + diff ke FastAPI AI engine
  7_parsing: Parse AI response JSON
  8_storage: Simpan hasil audit ke database
  9_visualization: Dashboard display real-time results
  10_user_view: User lihat compliance score dan Mermaid diagram

technology_stack:
  backend: Laravel 11
  database: PostgreSQL
  queue: Redis
  ai_service: FastAPI + OpenAI
  frontend: Blade + TailwindCSS
  visualization: Mermaid.js

key_features:
  - real_time_audit_results
  - dynamic_mermaid_visualization
  - compliance_score_tracking
  - audit_history_logging
  - github_webhook_integration
  - async_queue_processing

compliance_checks:
  - authentication: Middleware dan authentication implementation
  - validation: Input validation dan error handling
  - logging: Activity logging dan error tracking
  - response: JSON/API response format

success_metrics:
  - github_webhook_working: true
  - ai_audit_returns_json: true
  - mermaid_dynamic_update: true
  - compliance_score_visible: true
  - demo_end_to_end_stable: true

openspec_files:
  - github-webhook.yaml: "POST /webhook/github"
  - dashboard.yaml: "GET /dashboard"
  - queue-processing.yaml: "ProcessAuditJob handler"
  - project-details.yaml: "GET /project/{id}"
  - audit-api.yaml: "GET /api/project/{id}/audits"

api_contract:
  ai_engine:
    endpoint: http://localhost:8000/api/audit
    method: POST
    request:
      spec: string (YAML spec content)
      diff: string (git diff)
    response:
      score: integer (0-100)
      status: enum (pending, partial, complete, failed)
      missing_requirements: array<string>
      node_status:
        auth: boolean
        validation: boolean
        logging: boolean

database_schema:
  projects:
    - id: primary key
    - name: string
    - repo_url: string
    - spec_content: longtext
    - created_at: timestamp
    - updated_at: timestamp

  audits:
    - id: primary key
    - project_id: foreign key
    - commit_hash: string
    - score: integer
    - status: enum
    - result_json: json
    - created_at: timestamp
    - updated_at: timestamp

environment_variables:
  GITHUB_WEBHOOK_SECRET: string
  AI_SERVICE_URL: string
  QUEUE_CONNECTION: redis
  DB_CONNECTION: pgsql

constraints:
  out_of_scope:
    - multi_tenant_architecture
    - complex_user_authentication
    - vector_database
    - rag_pipeline
    - full_repository_analysis
    - ast_semantic_parsing
    - realtime_websocket
    - complex_ui_animation
    - self_hosted_ai_models

testing_strategy:
  unit_tests:
    - model_relationships
    - business_logic
    - validations

  integration_tests:
    - webhook_to_queue
    - queue_to_ai_engine
    - database_storage
    - api_responses

  end_to_end_tests:
    - complete_github_push_flow
    - dashboard_display
    - audit_history_tracking

deployment:
  development: Local Docker Compose
  production: Kubernetes ready
  scaling: Horizontal scale for AI workers

status: ✅ COMPLETE
