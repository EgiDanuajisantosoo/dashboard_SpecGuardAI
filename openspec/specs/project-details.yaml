---
feature: Project Details - Audit History

description: |
  Menampilkan detail project tertentu beserta audit history lengkap,
  visualisasi Mermaid diagram real-time, dan OpenSpec specification.

endpoint:
  method: GET
  path: /project/{id}

requirements:
  - display-latest-audit-details
  - show-mermaid-visualization
  - display-audit-history-table
  - show-openspec-content
  - show-missing-requirements
  - back-to-dashboard-link

page_sections:
  latest_audit:
    - compliance_score_percentage
    - status_badge
    - progress_bar
    - mermaid_diagram
    - missing_requirements_alert
    - recommended_prompt_panel
    - commit_hash
    - audit_timestamp

  audit_history:
    - table_with_columns: commit, score, status, date
    - pagination: 20_items_per_page
    - sorting: by_date_descending

  specification:
    - yaml_code_block
    - read_only_display
    - copy_button

response:
  body:
    project:
      id: integer
      name: string
      repo_url: string
      spec_content: string
      created_at: datetime

    latest_audit:
      id: integer
      score: integer
      status: string
      result_json: object
      recommended_prompt: string
      commit_hash: string
      created_at: datetime

    audits:
      - id: integer
        commit_hash: string
        score: integer
        status: string
        created_at: datetime

mermaid_diagram:
  dynamic_coloring:
    - node_auth: based_on_node_status.auth
    - node_validation: based_on_node_status.validation
    - node_logging: based_on_node_status.logging

validation:
  - project_must_exist
  - audit_records_must_exist
  - mermaid_data_must_be_valid
  - spec_must_be_yaml_format

logging:
  - log_project_details_accessed
  - log_audit_history_loaded
  - log_mermaid_rendering

performance:
  - load_latest_20_audits_paginated
  - cache_project_data_5_minutes
  - lazy_load_mermaid_diagram

testing:
  - test_project_not_found
  - test_empty_audit_history
  - test_audit_history_pagination
  - test_mermaid_color_updates
  - test_spec_display
  - test_back_navigation
