---
feature: GitHub Webhook Listener

description: |
  Menerima push event dari GitHub dan mengirimkan ke queue untuk diproses
  oleh AI audit engine.

endpoint:
  method: POST
  path: /webhook/github
  content_type: application/json

requirements:
  - github-signature-verification
  - payload-extraction
  - commit-diff-extraction
  - queue-job-dispatch
  - error-logging

security:
  - github-hmac-sha256-validation
  - webhook-secret-environment-variable
  - signature-header-verification

flow:
  - receive_webhook_payload
  - validate_github_signature
  - extract_commit_hash
  - extract_repository_url
  - fetch_commit_diff
  - create_audit_record
  - dispatch_to_queue
  - return_202_accepted

response:
  success:
    status: 202
    body:
      message: string
      audit_id: integer
  error_invalid_signature:
    status: 401
    body:
      error: string
  error_project_not_found:
    status: 404
    body:
      error: string

validation:
  - signature_must_be_valid
  - payload_must_be_json
  - commit_hash_must_not_be_empty
  - project_must_exist_in_database

logging:
  - log_webhook_received
  - log_signature_validation_result
  - log_queue_dispatch_success
  - log_any_errors

testing:
  - test_valid_github_webhook
  - test_invalid_signature
  - test_non_existent_project
  - test_queue_job_dispatched
