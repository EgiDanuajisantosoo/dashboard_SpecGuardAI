---
feature: Audit API - Get Project Audits

description: |
  API endpoint untuk mendapatkan daftar audit dari project tertentu
  dalam format JSON, mendukung pagination dan filtering.

endpoint:
  method: GET
  path: /api/project/{id}/audits
  query_params:
    page: integer (default: 1)
    per_page: integer (default: 10, max: 100)
    sort_by: enum (created_at, score) (default: created_at)
    status: enum (pending, partial, complete, failed) (optional)

content_type: application/json

requirements:
  - pagination_support
  - json_response_format
  - filter_by_status
  - sort_by_score_or_date
  - include_total_count
  - include_links

response_success:
  status: 200
  body:
    data:
      - id: integer
        project_id: integer
        commit_hash: string
        score: integer
        status: string
        result_json: object
        recommended_prompt: string
        created_at: datetime
        updated_at: datetime

    pagination:
      total: integer
      per_page: integer
      current_page: integer
      last_page: integer
      from: integer
      to: integer

    links:
      first: string (url)
      last: string (url)
      prev: string (url or null)
      next: string (url or null)

response_error:
  404:
    status: 404
    body:
      message: Project not found
  400:
    status: 400
    body:
      message: Invalid query parameters

validation:
  - project_must_exist
  - page_must_be_positive_integer
  - per_page_must_be_1_to_100
  - sort_by_must_be_valid_field
  - status_filter_must_be_valid_enum

query_examples:
  - /api/project/1/audits?page=1&per_page=10
  - /api/project/1/audits?sort_by=score&status=partial
  - /api/project/1/audits?per_page=50

caching:
  - cache_results_2_minutes
  - invalidate_on_new_audit

logging:
  - log_api_request
  - log_query_parameters
  - log_result_count

rate_limiting:
  - 60_requests_per_minute_per_ip

testing:
  - test_successful_pagination
  - test_sort_by_score
  - test_sort_by_date
  - test_filter_by_status
  - test_invalid_project
  - test_invalid_page_number
  - test_per_page_limits
  - test_response_format
