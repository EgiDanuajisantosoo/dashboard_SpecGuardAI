# =============================================================================
# SpecGuard AI — Shared ConfigMap & Secrets
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: specguard-config
  namespace: specguard
data:
  APP_NAME: "SpecGuardAI"
  APP_ENV: "local"
  APP_DEBUG: "true"
  APP_URL: "http://localhost"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_LEVEL: "debug"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "specguard"
  DB_USERNAME: "specguard"
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "redis"
  CACHE_STORE: "redis"
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MAIL_MAILER: "log"
  OPENAI_MODEL: "gemini-1.5-flash"
  OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
  OPENAI_REQUEST_TIMEOUT: "120"
---
apiVersion: v1
kind: Secret
metadata:
  name: specguard-secrets
  namespace: specguard
type: Opaque
stringData:
  APP_KEY: "base64:BeQ9ATj2sX2RDX26XwQE7EKhwZFe/0U+s+806j6DzMw="
  DB_PASSWORD: "specguard_secret"
  OPENAI_API_KEY: "your-api-key-here"
  GITHUB_WEBHOOK_SECRET: "your-webhook-secret-here"
  REDIS_PASSWORD: ""
